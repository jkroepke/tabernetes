name: ❓ Question
description: Something is not clear.
labels: [ ❓ question ]
body:
  - type: textarea
    attributes:
      label: Problem Statement
      description: Without specifying a solution, describe what the project is missing today.
      placeholder: |
        The rotating project logo has a fixed size and color.
        There is no way to make it larger and more shiny.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Environment
      description: |
        examples:
        - **Tabernetes version**: v1.0.0
      value: |
        - Tabernetes version:
        - Browser:
        - Node (docker run) host, if any:
    validations:
      required: false

  - type: checkboxes
    id: documentation
    attributes:
      label: Preflight Checklist
      options:
        - required: true
          #language=markdown
          label: |
            I could not find a solution in the [README](https://github.com/jkroepke/tabernetes#readme) or the existing issues.
