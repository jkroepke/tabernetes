# Tabernetes: a Kubernetes control plane in the browser.
#
#   mise run build       build the WebAssembly binary and the terminal into dist/
#   mise run web         rebuild only the terminal (needs .build/wasm_exec.js)
#   mise run vm          build the VM for container images on tab nodes (needs docker)
#   mise run dist        pack dist/ into .build/tabernetes.tar.gz, the asset of a release
#   mise run test        run the etcd shim tests
#   mise run node-image  build the node image (tabernetes) for the local platform
#
# Updating Kubernetes means bumping KUBERNETES_VERSION, running `mise run build`
# and fixing whatever k8s/patch.go complains about.

[tools]
go = "1.27.4"
node = "26.13.1"

[env]
# renovate: github-tags=kubernetes/kubernetes
KUBERNETES_VERSION = "v1.37.2"
NODE_IMAGE = "ghcr.io/jkroepke/tabernetes"
# The shell of the terminal, vendored into the Kubernetes checkout by k8s/patch.go.
# renovate: go=mvdan.cc/sh/v3
MVDAN_SH_VERSION = "v3.14.1"
# The image whose busybox runs the start that web/jit.mjs records.
# renovate: docker=alpine
JIT_ROOT_IMAGE = "alpine:3.22"

[tasks.checkout]
description = "Clone Kubernetes at KUBERNETES_VERSION into .build/kubernetes"
run = '''
k8s=.build/kubernetes
if [ ! -e "$k8s/.version-$KUBERNETES_VERSION" ]; then
  mkdir -p .build
  if [ -e "$k8s" ]; then mv "$k8s" ".build/kubernetes.old-$$"; fi
  git clone --quiet --depth 1 --branch "$KUBERNETES_VERSION" https://github.com/kubernetes/kubernetes "$k8s"
  touch "$k8s/.version-$KUBERNETES_VERSION"
fi
'''

[tasks.patch]
description = "Reset the Kubernetes checkout and apply k8s/patch.go"
depends = ["checkout"]
sources = ["mise.toml", "k8s/patch.go", "k8s/_overlay/**/*", "k8s/tabernetes/**/*"]
outputs = [".build/kubernetes/.patched"]
run = '''
git -C .build/kubernetes checkout --quiet -- .
git -C .build/kubernetes clean --quiet -fd -e ".version-$KUBERNETES_VERSION"
go -C k8s run . "$PWD/.build/kubernetes"
touch .build/kubernetes/.patched
'''

[tasks.wasm]
description = "Build dist/tabernetes.wasm.zst"
depends = ["patch"]
sources = [".build/kubernetes/.patched", "k8s/build.sh", "k8s/snapshot.mjs", "web/src/fs.js"]
outputs = ["dist/tabernetes.wasm.zst", ".build/wasm_exec.js"]
run = '''
mkdir -p dist
k8s/build.sh .build/kubernetes .build/tabernetes.wasm
# wasm_exec.js must come from the same Go version that built tabernetes.wasm.
cp "$(cd .build/kubernetes && go env GOROOT)/lib/wasm/wasm_exec.js" .build/wasm_exec.js
# zstd -19 is about 40 % smaller than gzip -9. Node.js has zstd built in.
# Independent frames of 32 MiB (0.6 % larger than one frame): the page unpacks
# each frame in a worker as soon as it is downloaded, several in parallel.
node -e '
  const fs = require("node:fs"), os = require("node:os"), zlib = require("node:zlib"), c = zlib.constants;
  const wasm = fs.readFileSync(process.argv[1]), frames = [];
  for (let i = 0; i < wasm.length; i += 32 << 20) frames.push(zlib.zstdCompressSync(wasm.subarray(i, i + (32 << 20)), { params: {
    [c.ZSTD_c_compressionLevel]: 19, [c.ZSTD_c_checksumFlag]: 1, [c.ZSTD_c_nbWorkers]: os.availableParallelism() } }));
  fs.writeFileSync(process.argv[2], Buffer.concat(frames));
' .build/tabernetes.wasm dist/tabernetes.wasm.zst
'''

[tasks.vm]
description = "Build the kernel and init that v86 boots into dist/vm/"
run = '''
# docker builds them (vm/Dockerfile) only when vm/ changed.
out=dist/vm
sum="$(find vm -type f | LC_ALL=C sort | xargs shasum -a 256 | shasum -a 256 | cut -d" " -f1)"
if [ "$(cat "$out/.sum" 2>/dev/null)" != "$sum" ]; then
  rm -rf "$out"
  docker build --output "type=local,dest=$out" vm
  echo "$sum" > "$out/.sum"
fi
'''

[tasks.web]
description = "Bundle the terminal into dist/"
depends = ["vm"]
wait_for = ["wasm"]
run = '''
if [ ! -f .build/wasm_exec.js ]; then mise run wasm; fi
# The page that embeds them should give them fingerprinted URLs (the blog does it
# with Hugo), so the browser can cache them for good.
mkdir -p dist
out="$(cd dist && pwd)"
# The printed docker run of a release (TABERNETES_VERSION=v1.2.3, set by CI)
# uses the node image of that release, everything else uses latest.
image="$NODE_IMAGE:latest"
if [ -n "${TABERNETES_VERSION:-}" ]; then image="$NODE_IMAGE:${TABERNETES_VERSION#v}"; fi
# uname -r shows the release; the binary is the same for every release (CI
# caches it), so the bundle hands the version to it (k8s/tabernetes/uname.go).
version="${TABERNETES_VERSION:-dev}"
cp .build/wasm_exec.js web/src/wasm_exec.js
# Go reads the wall clock from Date.now(), in whole milliseconds, so two
# events in the same millisecond get the same name. performance.now() is
# finer (0.1 ms in Chrome, coarser in Firefox and Safari). It may drift from
# the wall clock (laptop sleep), so it is used only while it agrees with
# Date.now() to the millisecond.
node -e '
  const fs = require("node:fs"), f = process.argv[1];
  const old = "const msec = (new Date).getTime();";
  const src = fs.readFileSync(f, "utf8");
  if (!src.includes(old)) throw new Error("wasm_exec.js: runtime.walltime changed, update the patch in mise.toml");
  fs.writeFileSync(f, src.replace(old, "const now = Date.now(), fine = performance.timeOrigin + performance.now(); const msec = Math.abs(fine - now) < 1 ? fine : now;"));
' web/src/wasm_exec.js
cd web
npm ci --no-audit --no-fund
npx esbuild src/index.js --bundle --minify --format=esm --target=es2022 \
  --define:TABERNETES_IMAGE="\"$image\"" \
  --define:TABERNETES_VERSION="\"$version\"" \
  --define:V86_VERSION="\"$(node -p 'require("./node_modules/v86/package.json").version')\"" \
  --outfile="$out/tabernetes.js"
# The zstd decoder runs in a worker, so that the page does not freeze.
npx esbuild src/unzstd.js --bundle --minify --format=iife --target=es2022 --outfile="$out/unzstd.js"
# WebLLM for llm (tab node) runs in a worker of its own, loaded only by llm.
npx esbuild src/gpuworker.js --bundle --minify --format=iife --target=es2022 --outfile="$out/gpuworker.js"
# The control plane runs in a shared worker, so that all tabs of the page join
# one cluster (k8s/tabernetes/tabs.go).
npx esbuild src/cluster.js --bundle --minify --format=iife --target=es2022 \
  --define:TABERNETES_VERSION="\"$version\"" --outfile="$out/cluster.js"
# Container images on the tab node run in v86, an x86 emulator, one worker per
# pod. v86 imports node modules only when it runs in Node.js.
npx esbuild src/vmworker.js --bundle --minify --format=iife --target=es2022 \
  --external:crypto --external:node:crypto --external:fs --external:node:fs/promises --external:perf_hooks \
  --outfile="$out/vmworker.js"
cp node_modules/v86/build/v86.wasm "$out/v86.wasm"
# The JIT modules of the kernel of the pods (web/jit.mjs, vm.js) and the state
# of their booted VM (vmstate.js), for this v86 and this kernel. The page
# passes the URLs as data-vm-jit and data-vm-state; without them the pods
# start without the modules, and the first pod boots the kernel. The start that it records runs a busybox shell of
# Alpine (linux/386; docker only exports the files, so no emulation).
root="../.build/jitroot-$(echo "$JIT_ROOT_IMAGE" | tr ":/" "__").tar"
if [ ! -f "$root" ] && command -v docker > /dev/null; then
  mkdir -p ../.build
  c="$(docker create --platform linux/386 "$JIT_ROOT_IMAGE")"
  docker export "$c" > "$root.part" && mv "$root.part" "$root"
  docker rm "$c" > /dev/null
fi
if [ -f "$root" ]; then
  node jit.mjs ../dist/vm "$root" "$out/jit.bin" "$out/vmstate.bin"
else
  echo "no docker: dist/jit.bin and dist/vmstate.bin are missing, pods start without the JIT modules and the state of the kernel" >&2
  rm -f "$out/jit.bin" "$out/vmstate.bin"
fi
cp node_modules/@xterm/xterm/css/xterm.css "$out/xterm.css"
# The service worker of "proxy <port>". The page serves it as
# /tabernetes-proxy/sw.js, its scope is /tabernetes-proxy/ (web/src/proxy.js).
cp proxy-sw.js "$out/proxy-sw.js"
'''

[tasks.build]
description = "Build everything into dist/"
depends = ["wasm", "web"]

[tasks.dist]
description = "Pack dist/ (mise run build) into .build/tabernetes.tar.gz, the asset of a release"
run = '''
mkdir -p .build
tar -czf .build/tabernetes.tar.gz --exclude .sum -C dist .
(cd .build && shasum -a 256 tabernetes.tar.gz > tabernetes.tar.gz.sha256)
'''

[tasks.test]
description = "Run the control plane, shell and VM init tests; vet the node agent"
depends = ["patch"]
dir = "{{config_root}}/.build/kubernetes"
run = """
go test ./cmd/tabernetes/etcdshim/
GOOS=js GOARCH=wasm go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./cmd/tabernetes/
node --test {{config_root}}/vm/test/*.test.mjs
GOOS=linux go -C {{config_root}}/node/agent vet ./...
"""

[tasks.node-image]
description = "Build the node image for the local platform"
run = 'docker build --build-arg KUBERNETES_VERSION="$KUBERNETES_VERSION" --build-context addons=k8s/tabernetes/addons -t "$NODE_IMAGE:latest" node'
